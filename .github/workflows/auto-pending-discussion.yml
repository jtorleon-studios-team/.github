name: Auto Add To Pending Discussion
on:
  issue_comment:
    types: [created]
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - run: gh issue edit "$NUMBER" --add-label "$LABELS"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          LABELS: "Pending Discussion"

      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/jtorleon-studios-team/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
        id: add-project

      - name: Debug itemId
        run: echo "${{ steps.add-project.outputs.itemId }}"


      - uses: titoportas/update-project-fields@v0.1.0
        with:
          project-url: https://github.com/users/titoportas/projects/2
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          item-id: ${{ steps.add-project.outputs.itemId }}
          field-keys: Status
          field-values: Pending Discussion
