name: Release
run-name: ${{ github.actor }} run ${{ github.action }}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  attest:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      
      - name: "download content from draft release"
        run: gh release download "$TAG" --pattern '*.jar'
      
      - name: "attest build provenance"
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: '*.jar'

      - name: "publish the release"
        run: gh release edit "$TAG" --draft=false

      - name: "verify attestation on the downloaded content"
        run: |
          for jar in *.jar; do
            gh attestation verify "$jar" --owner "${{ github.repository_owner }}"
          done
