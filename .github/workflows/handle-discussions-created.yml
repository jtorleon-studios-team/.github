name: Handle Discussion Created
on:
  discussion:
    types: [created]
jobs:
  filter-discussion:
    runs-on: ubuntu-22.04
    outputs:
      status: ${{ steps.set-output-filter.outputs.status }}
    steps:
      - id: set-output-filter
        name: Filter Discussion
        run: |
          echo "::group::Filter Discussion"
          echo "discussion ${{ github.event.discussion.node_id }} ${{ github.event.discussion.title }}"
          echo "discussion category ${{ github.event.discussion.category.node_id }} ${{ github.event.discussion.category.name }}"
          if [ "${{ github.event.discussion.category.name }}" == "Polls" ]; then
            echo "match"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "ignored"
            echo "status=ignored" >> $GITHUB_OUTPUT
          fi
          echo "::endgroup::"

  handle-discussion:
    runs-on: ubuntu-22.04
    needs: filter-discussion
    if: needs.filter-discussion.outputs.status == 'success'
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4

      - id: prepare-data
        name: Prepare data
        run: |
          owner="${{ github.repository_owner }}"
          repo="${{ github.repository }}"
          discussion_id="${{ github.event.discussion.id }}"
          discussion_url="https://github.com/$owner/$repo/discussions/$discussion_id"

          messageToJson=$( jq -n\
            --arg content "|| $discussion_url ||" \
            --arg title "A polls has been created" \
            --arg author_name "${{ github.event.discussion.user.name }}" \
            --arg avatar_url "${{ github.event.discussion.user.avatar_url }}" \
            --arg open_url "$discussion_url" \
            '{
              content: $content,
              embeds: [
                {
                  title: $title,
                  color: 39129,
                  author: {
                    name: $author_name,
                    url: $open_url,
                    icon_url: $avatar_url
                  },
                  fields: [
                    { 
                      name: "Open on github",
                      value: $open_url,
                      inline: false
                    }
                  ],
                  image: {
                    url: "https://raw.githubusercontent.com/jtorleon-studios-team/.github/refs/heads/main/assets/polls.png"
                  }
                }
              ]
             }'\
          )

          curl -H "Content-Type: application/json" -d "${messageToJson}" ${{ secrets.POOLS_DISCORD }}
