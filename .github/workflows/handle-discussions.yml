name: Handle Discussion

on:
  discussion:
    types: [unlocked]

jobs:
  handle-discussion:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - run: |
          echo "Discussion locked: ${{ github.event.discussion.title }}"

          if [ "${{ github.event.discussion.title }}" == "announcements" ]; then
            discussion_id="${{ github.event.discussion.id }}"

            curl -X PATCH "https://api.github.com/discussions/${{ github.event.discussion.id }}/comments/1" \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github.v3+json" \
              -d '{"body": "Updated message for the discussion"}'
            
            echo "Discussion edited"
          fi
